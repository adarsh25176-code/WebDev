<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>External Style Sheet Example</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /*<h1> {
        color:bisque;
    }*/
    .box{
        color:aqua;
        width: 100;
        height: 120;
        font-size: 20;
        padding: 12;
        margin: 15;
        box-sizing : border box;
        border: 2px solid rgb(9, 223, 134);
        background-color: rgb(10, 142, 76);
        
    }
    #intro{
        color:aquamarine;
        font-size: 16px;

        height: 120;
        width: 150px;
    }
    .note{
        color:rgb(82, 39, 122);
        font-size: 20px;
    }
    #adarsh{
        color: rgb(33, 159, 179);
        font-size: 23px;
    }



  </style>
</head>
<body>
  <h1 class="box">This is a heading</h1>
  <p id="intro">This is a paragraph with external styles applied.</p>
  <p class="note">hello pg</p>
  <p id="adarsh">hello alakh </p>
</body>
</html>
