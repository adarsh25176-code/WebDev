<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Element selector */
        h1{
            color:aqua;
        }
        p {
            color: rgb(9, 223, 134);
            font-size: 24px;
            border: 2px solid rgb(9, 223, 134);
        }
        #intro{
            color: rgb(228, 188, 30);
            font-size: 16px;
        
        width: 200px;
            height: 180px;
            background-color: rgb(22, 24, 23);
        }
        .note{
            color:rgb(219, 11, 87);
        }
        #ada{
            color: rgb(22, 101, 247);
            font-size: 16px;
        }
        #player{
            color:blueviolet;
        }
        .box{
            width: 200px;
            height: 250px;
            background-color: rgb(22, 24, 23);
            padding: 70px;
            margin: 60px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1 class="box">this is my heading</h1>
    <p id="intro" >Hello CSS!</p>
    <p class="note">my name is John Doe</p>
    <p id="ada">Hello pw</p>
    <p id="player">heloo mirai</p>
    
</body>
</html>
