<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Element selector */
        h1{
            color:aqua;
        }
        p {
            color: rgb(9, 223, 134);
            font-size: 24px;
            border: 2px solid rgb(9, 223, 134);
        }
        #intro{
            color: rgb(228, 188, 30);
            font-size: 16px;
        
        width: 150px;
            height: 100px;
            background-color: rgb(22, 24, 23);
        }
        .note{
            color:rgb(219, 11, 87);
        }
        #ada{
            color: rgb(22, 101, 247);
            font-size: 16px;
        }
        #player{
            color:blueviolet;
        }
        .box{
            width: 170px;
            height: 100px;
            background-color: rgb(53, 127, 90);
            padding: 20px;
            margin: 10px;
            box-sizing: border-box;
        }
        div>p{
            color: rgb(255, 255, 255);
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div>
        <p>dog</p>
        <div>
        <p>cat</p>
        </div>
    </div>
<div class="parent">
  <p class="em-text">I use em</p>
  <p class="rem-text">I use rem</p>
</div>
    <h1 class="box">this is my heading</h1>
    <p id="intro" >Hello CSS!</p>
    <p class="note">my name is John Doe</p>
    <p id="ada">Hello pw</p>
    <p id="player">heloo mirai</p>
    
</body>
</html>
